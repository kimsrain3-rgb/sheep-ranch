<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루의 질문 수첩 · 바람목장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2e8;color:#283e31;font:1rem/1.6 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:2rem 1rem}h1{font:600 2rem/1.4 Georgia,serif}h2{font-size:1.2rem}button,a{color:#25503a}article,form{background:#fffef7;border:1px solid #d4dccc;border-radius:10px;padding:1rem;margin:.8rem 0}label{display:block;font-weight:600;margin:.7rem 0}input,select,textarea,button{font:inherit}input,textarea,select{display:block;width:100%;padding:.6rem;border:1px solid #a4b2a1;border-radius:5px}button{padding:.55rem 1rem;border:0;border-radius:6px;cursor:pointer}button[type=submit]{background:#345a41;color:white}#status{color:#38523c}#rows button{text-align:left;width:100%;background:#edf1e6}#rows p{white-space:pre-wrap}
</style></head><body><main><h1>하루의 질문 수첩</h1><p id="status" role="status">수첩을 여는 중이에요.</p>
<p id="access" hidden><a target="_top" href="/signin-with-chatgpt?return_to=%2Fnotebook.html">운영자 계정으로 로그인</a></p>
<section id="desk" hidden><button id="new">목장 일지 쓰기</button>
<form id="editor" hidden><h2 id="heading">답 가르치기</h2><label>질문 요지 또는 일지 제목<input id="summary" maxlength="80" required></label><label>기록 종류<select id="kind"><option value="question">질문에 대한 답</option><option value="planned">예정된 일</option><option value="observed">실제로 확인한 일</option></select></label><label>하루가 알려줄 내용<textarea id="answer" rows="4" maxlength="700" required></textarea></label>
<p>답에 {풍차}, {목장시간}, {둥지}, {내양}을 넣으면 질문한 순간의 값으로 바뀝니다.</p><button type="submit">저장하기</button> <button id="cancel" type="button">닫기</button></form><div id="rows"></div></section></main><script type="module" src="notebook.js"></script></body></html>
